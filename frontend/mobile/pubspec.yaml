name: mobile
description: "AppView - Thư viện ảnh và video tương thích hệ thống AppView"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.8.0+1
  cached_network_image: ^3.4.1
  video_player: ^2.9.2
  shared_preferences: ^2.3.5
  provider: ^6.1.2
  intl: ^0.20.2
  shimmer: ^3.0.0
  photo_view: ^0.15.0
  flutter_svg: ^2.0.17
  path_provider: ^2.1.5
  flutter_cache_manager: ^3.4.1
  web_socket_channel: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
